name: Watch GopenPGP upstream

# Notices when ProtonMail/gopenpgp publishes a newer release than the one this
# app pins, and opens a pull request bumping it.
#
# **A PR, not an automatic rebuild.** "Rebuild when upstream changes" is the
# goal, but a crypto implementation that swaps itself under a mail client with
# no human in the loop is a supply-chain foothold, not a convenience: anyone who
# can publish a gopenpgp tag would be publishing into this app. Merging the PR
# changes Dependencies/gopenpgp.env, which is what triggers the build workflow —
# so the rebuild is automatic once a person has said yes.

on:
  schedule:
    # Daily. Upstream releases a few times a year; more often than this is
    # noise, less risks sitting on a security fix.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare pinned against upstream
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source Dependencies/gopenpgp.env

          # Proton tags both `vX.Y.Z` and `vX.Y.Z-proton`. The plain tag is the
          # library release; the -proton suffix carries their own patches and is
          # not what a third-party consumer should track.
          #
          # The highest release of the pinned major, by version — not the
          # newest by date. Proton maintains v2 alongside v3, and taking the
          # first listed release proposed v2.11.1 (published a day after
          # v3.5.2) as a "bump" from v3.4.1: a major-version downgrade. A new
          # major is an API change the app has to be ported to, never a pin bump.
          MAJOR=${GOPENPGP_VERSION%%.*}
          LATEST=$(gh release list --repo ProtonMail/gopenpgp --limit 100 \
              --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' \
            | grep -E "^${MAJOR}\.[0-9]+\.[0-9]+$" | sort -V | tail -1 || true)

          echo "pinned=$GOPENPGP_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          HIGHER=$(printf '%s\n%s\n' "$GOPENPGP_VERSION" "$LATEST" | sort -V | tail -1)
          if [ -z "$LATEST" ] || [ "$LATEST" = "$GOPENPGP_VERSION" ] || [ "$HIGHER" != "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pinned $GOPENPGP_VERSION; highest $MAJOR release upstream: ${LATEST:-none}. Nothing to do."
            exit 0
          fi

          # A pull request already open for this version is left alone. The
          # action below force-pushes its branch, which would throw away
          # whatever a person has added to that PR since.
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "chore/gopenpgp-$LATEST" --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "A pull request for $LATEST is already open; leaving it alone."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Bump the pin
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sed -i "s|^GOPENPGP_VERSION=.*|GOPENPGP_VERSION=${{ steps.check.outputs.latest }}|" \
            Dependencies/gopenpgp.env

      - name: Open a pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/gopenpgp-${{ steps.check.outputs.latest }}
          title: "chore: gopenpgp ${{ steps.check.outputs.pinned }} → ${{ steps.check.outputs.latest }}"
          commit-message: "chore: pin gopenpgp ${{ steps.check.outputs.latest }}"
          body: |
            ProtonMail/gopenpgp published `${{ steps.check.outputs.latest }}`;
            this app pins `${{ steps.check.outputs.pinned }}`.

            Merging rebuilds the XCFramework and publishes a new release asset,
            because `Dependencies/gopenpgp.env` is the build workflow's trigger.
            **The app's pinned checksum then has to be updated to match** — the
            build's summary prints it.

            Read the upstream changelog before merging. This PR exists so that
            a new gopenpgp tag cannot reach this app without someone deciding
            it should.
