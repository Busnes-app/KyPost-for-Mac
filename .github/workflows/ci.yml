name: CI

# Phase 0 of the Android-parity plan: this repository had no CI at all, and
# `main` shipped in a state that did not compile.
#
# The tests run on the **iOS Simulator**, which is what makes this workflow
# need no secrets at all. That is not an arbitrary choice — it is the only
# arrangement that works on an ephemeral runner:
#
#   * The suite runs inside the host app, and KeychainStorage uses the
#     data-protection Keychain, which returns errSecMissingEntitlement
#     (-34018) to a process without `keychain-access-groups`. Measured: 140
#     tests fail that way with signing disabled. So the tests cannot simply be
#     run unsigned.
#   * A Mac **development** profile cannot supply that entitlement here.
#     Development profiles carry an explicit device list, and GitHub's runners
#     are ephemeral and unregistered, so signing fails with "provisioning
#     profile ... doesn't include the currently selected device". Registering
#     them is not a workaround: each run would consume one of 100 devices a
#     year.
#   * Simulator builds sign **ad-hoc** — `Signature=adhoc`,
#     `TeamIdentifier=not set`, no embedded profile — and the simulator does
#     not validate the team prefix on `keychain-access-groups`. The
#     entitlement is honoured, so the Keychain works.
#
# Measured, not assumed: 796 tests in 143 suites pass on the simulator with no
# certificate, no profile and no secrets.
#
# It also gives iOS its first automated coverage. Half the product had never
# been built by CI, which is how KyPost_iOS.entitlements sat unreferenced in
# project.pbxproj for months without anything noticing.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26, not macos-15: the macos-15 images top out at Xcode 26.3 /
    # SDK 26.3. The deployment target is 26.0 now, but it was 26.5 when the
    # first run hit a target newer than the SDK, and the newest Xcode 26 is
    # what release.yml archives with.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        # This project needs Xcode 26 — README pins the deployment target at
        # macOS/iOS 26.0. The first cut selected `/Applications/Xcode_16.app`,
        # which exists on the image and builds nothing here: xcodebuild exited
        # 70 rather than saying the SDK was too old.
        #
        # Chosen by globbing rather than a literal path, because the images
        # carry several 26.x and rename them as they update; pinning an exact
        # one means CI breaks on an image refresh rather than on a code change.
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26.x on this runner image; this project cannot build without one."
            ls -d /Applications/Xcode* || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

          # Check the SDKs actually satisfy the deployment targets, and say so
          # plainly if they do not. Without this the failure is `xcodebuild`
          # exiting 70 with no indication that the toolchain is the problem —
          # which is exactly how the first run read.
          for pair in "macosx:MACOSX_DEPLOYMENT_TARGET" "iphoneos:IPHONEOS_DEPLOYMENT_TARGET"; do
            sdk_name=${pair%%:*}
            setting=${pair##*:}
            SDK=$(xcrun --sdk "$sdk_name" --show-sdk-version)
            TARGET=$(grep -m1 -oE "$setting = [0-9.]+" \
              KyPost.xcodeproj/project.pbxproj | grep -oE '[0-9.]+$')
            echo "$sdk_name SDK $SDK, deployment target $TARGET"
            if [ "$(printf '%s\n%s\n' "$TARGET" "$SDK" | sort -V | tail -1)" != "$SDK" ]; then
              echo "::error::$sdk_name SDK $SDK is older than this project's deployment target $TARGET. Use a runner image carrying a newer Xcode."
              exit 1
            fi
          done

      - name: Pick a simulator
        # Resolved from what the image actually has rather than pinned to a
        # device name. The runner images add and retire devices between
        # refreshes, and a missing name fails as "Unable to find a destination",
        # which reads like a project fault rather than an image change.
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) for x in d[k] if 'iPhone' in x['name']))")
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator on this runner image."
            xcrun simctl list devices available || true
            exit 1
          fi
          xcrun simctl list devices available | grep "$UDID" || true
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Test
        # Unit tests only: the UI target drives a real app instance, is flaky
        # headless, and is not what protects this code.
        #
        # No pretty-printer in the pipeline. `| xcpretty` swallowed the real
        # exit status behind a tool that is not guaranteed on the image, and a
        # formatter is not worth a build step that can fail for its own reasons.
        #
        # Do NOT add CODE_SIGNING_ALLOWED=NO here as an "it's only a simulator"
        # tidy-up. That strips the entitlements rather than the certificate,
        # and puts 178 tests straight back onto -34018.
        run: |
          .github/scripts/run-xcodebuild.sh test \
            -scheme KyPost \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -only-testing:"KyPost Tests"

      - name: Build for macOS
        # The tests already ran on the simulator; this is the compile check for
        # the other platform, and it catches the failure mode that caused this
        # workflow to be written — `main` not building. Signing is disabled
        # because nothing is executed here.
        run: |
          .github/scripts/run-xcodebuild.sh build-for-testing \
            -scheme KyPost \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
