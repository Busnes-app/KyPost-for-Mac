name: Release

# Archives both platforms and uploads them to App Store Connect when a version
# tag is pushed. Until this existed the repository had no distribution path at
# all: ci.yml and two GopenPGP jobs, and nothing that produced a shippable
# artifact.
#
# There is deliberately NO notarisation step. Notarisation (notarytool) is for
# distributing outside the App Store; App Store builds are notarised by Apple
# during review. If this project ever adds a direct-download channel — the
# equivalent of Android's GitHub Releases APK — that channel needs a Developer
# ID identity and a notarise-and-staple step, and it is a separate job, not a
# flag on this one. (Cloud signing cannot do Developer ID either: Apple calls
# that a known bug, even with an Admin key.)
#
# Modelled on kypost-android's release.yml, which gates publication on the tag
# matching the versioned manifest and on the artifact carrying the expected
# signing identity. Both gates are reproduced here because both failures are
# silent and expensive: App Store Connect files a build under whatever
# CFBundleShortVersionString it carries, and that cannot be corrected after
# upload.
#
# SIGNING IS AUTOMATIC, with an App Store Connect API key.
#
#   archive        signs with an Apple Development identity. xcodebuild
#                  creates or refreshes the development profiles itself
#                  (-allowProvisioningUpdates plus the API key).
#   -exportArchive re-signs for the store with the team's cloud-managed
#                  Apple Distribution certificate and fetches the App Store
#                  profiles. No distribution certificate or profile exists
#                  as a secret.
#
# The development certificate IS a secret, and that is deliberate. Left to
# itself, xcodebuild creates a new "Apple Development: Created via API"
# certificate on a runner that has none, keeps the private key only in that
# runner's keychain, and on the next fresh runner refuses: "Your account
# already has an Apple Development signing certificate for this machine, but
# its private key is not installed in your keychain." Revoking it only resets
# the cycle (Apple Developer Forums thread 695759, reproduced through Xcode
# 15.4). Importing one fixed development identity is the known way out.
#
# ONE-TIME SETUP — what the maintainer creates (nothing here creates it):
#
#   GitHub → Settings → Environments → New environment named `release`.
#   Add required reviewers and limit deployment to tags matching `v*`, so a tag
#   pushed by anyone with write access cannot reach App Store Connect alone.
#   Then add these environment secrets:
#
#   APP_STORE_CONNECT_PRIVATE_KEY   the .p8 file, base64-encoded
#                                   (`base64 -i AuthKey_XXXX.p8 | pbcopy`).
#                                   Users and Access → Integrations → Team
#                                   Keys. The key MUST have the Admin role:
#                                   cloud-managed distribution certificates
#                                   are refused to every other role, and an
#                                   API key has no per-key cloud-signing
#                                   permission to grant instead.
#   APP_STORE_CONNECT_KEY_ID        the key's ID (10 characters).
#   APP_STORE_CONNECT_ISSUER_ID     the issuer UUID shown above the key list.
#   APPLE_DEVELOPMENT_CERTIFICATE   an Apple Development certificate of team
#                                   TATYN4X57D with its private key, exported
#                                   from Keychain Access as .p12, base64-encoded.
#   APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD
#                                   the password chosen for that .p12 export.
#
#   The team needs at least one registered iOS device: automatic signing
#   cannot create an iOS development profile for a team with none.
#
# The build number (CFBundleVersion) is `<run_number>.<run_attempt>` of this
# workflow, passed as CURRENT_PROJECT_VERSION. It rises with every release run,
# and a re-run of a failed run (which may already have uploaded one platform)
# gets a new number instead of a duplicate App Store Connect would refuse.
# project.pbxproj keeps CURRENT_PROJECT_VERSION = 1 for local builds; nothing
# commits the CI value back.

on:
  push:
    tags:
      - "v*"

# Not concurrency-cancelled. A half-finished upload is worse than a slow one.
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    # Secrets live on a protected environment so a tag pushed by anyone with
    # write access cannot silently reach App Store Connect.
    environment: release

    env:
      DEVELOPMENT_CERTIFICATE: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE }}
      DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      # Not a secret: it is already in project.pbxproj. Named here so the
      # signer check has something to compare against.
      EXPECTED_TEAM_ID: TATYN4X57D
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7

      # Fail on a missing secret before spending ten minutes on an archive
      # that cannot be signed, and name the one that is missing rather than
      # letting codesign report it as something else.
      - name: Required secrets are present
        run: |
          set -euo pipefail
          missing=""
          for name in DEVELOPMENT_CERTIFICATE DEVELOPMENT_CERTIFICATE_PASSWORD \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release secrets on the 'release' environment:$missing"
            exit 1
          fi

      - name: Select Xcode
        # Same globbing as ci.yml, and for the same reason: the images carry
        # several 26.x and rename them as they update, so an exact path breaks
        # on an image refresh rather than on a code change.
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26.x on this runner image; this project cannot build without one."
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # The tag is attacker-influenceable text: git permits `$` and backticks
      # in a tag name, so it goes through the environment and never into the
      # shell source. Same reasoning as Android's release.yml.
      - name: Tag matches MARKETING_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/verify-version.sh "$TAG"

      - name: Install development identity
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/release.keychain-db
          PASSWORD=$(uuidgen)

          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo "$DEVELOPMENT_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPMENT_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/dev.p12"

          # Without this codesign blocks on a GUI prompt no one can answer and
          # the job hangs until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # The suite runs here as well as in ci.yml. ci.yml can only compile on a
      # fork or without secrets, so a tag is the first point at which a green
      # check has actually meant the tests passed.
      - name: Test
        # On the simulator, which needs no identity: a development profile
        # cannot cover an ephemeral, unregistered runner, so the app cannot be
        # run here signed. Same arrangement as ci.yml, for the same reasons —
        # see its header.
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) for x in d[k] if 'iPhone' in x['name']))")
          .github/scripts/run-xcodebuild.sh test \
            -scheme KyPost \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -only-testing:"KyPost Tests"

      # CODE_SIGN_STYLE stays Automatic, as project.pbxproj sets it.
      - name: Archive
        run: |
          set -euo pipefail
          for platform in macOS iOS; do
            .github/scripts/run-xcodebuild.sh archive \
              -scheme KyPost \
              -destination "generic/platform=${platform}" \
              -archivePath "$RUNNER_TEMP/KyPost-${platform}.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          done

      # Proves the artifact carries the identity and build number we think it
      # does, before it reaches anyone. A swapped certificate secret produces a
      # perfectly valid build signed by the wrong team, which cannot be walked
      # back once it is on App Store Connect. The export re-signs with the
      # distribution certificate of the teamID in ExportOptions, which is the
      # same team.
      - name: Archive carries the expected team and build number
        run: |
          set -euo pipefail
          for platform in macOS iOS; do
            app=$(find "$RUNNER_TEMP/KyPost-${platform}.xcarchive/Products/Applications" \
              -maxdepth 1 -name '*.app' | head -1)
            if [ -z "$app" ]; then
              echo "::error::No .app in the ${platform} archive; the archive step did not produce what this expects."
              exit 1
            fi
            actual=$(codesign -dvv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -1)
            if [ -z "$actual" ]; then
              echo "::error::Could not read a TeamIdentifier out of the ${platform} build; parsing needs updating."
              exit 1
            fi
            if [ "$actual" != "$EXPECTED_TEAM_ID" ]; then
              echo "::error::${platform} build is signed by ${actual}, expected ${EXPECTED_TEAM_ID}. Refusing to upload."
              exit 1
            fi
            plist="$app/Info.plist"
            [ -f "$plist" ] || plist="$app/Contents/Info.plist"
            build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
            if [ "$build" != "$BUILD_NUMBER" ]; then
              echo "::error::${platform} build number is ${build}, expected ${BUILD_NUMBER}. Refusing to upload."
              exit 1
            fi
            echo "${platform}: signer ${actual}, build ${build}"
          done

      # Export and upload are one step: ExportOptions carries
      # destination=upload, so there is no intermediate artifact for a later
      # step to upload the wrong copy of.
      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          for platform in macOS iOS; do
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/KyPost-${platform}.xcarchive" \
              -exportOptionsPlist "Distribution/ExportOptions-${platform}.plist" \
              -exportPath "$RUNNER_TEMP/export-${platform}" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          done

      - name: Remove the signing keychain
        # `always()`: a keychain holding the team's development identity, and a
        # private key that can upload to App Store Connect, should not outlive
        # the job even when the job failed.
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -rf "$RUNNER_TEMP/private_keys"
