name: Build GopenPGP XCFramework
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dependencies/**
      - .github/scripts/build-gopenpgp.sh
      - .github/workflows/gopenpgp-xcframework.yml
  push:
    branches: [main]
    paths:
      - Dependencies/**
      - .github/scripts/build-gopenpgp.sh
      - .github/workflows/gopenpgp-xcframework.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: Dependencies/KyPostCrypto/go.sum
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh
      - name: Build upstream and KyPost bridge in one runtime
        run: .github/scripts/build-gopenpgp.sh
      - name: Retain framework for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gopenpgp-xcframework
          path: Dependencies/GopenPGP/gopenpgp.xcframework
