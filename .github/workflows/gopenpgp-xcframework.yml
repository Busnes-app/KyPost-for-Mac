name: Build GopenPGP XCFramework

# Produces the binary this app links, from source, on GitHub's runners — so the
# artifact in a mail client's crypto path has a build log anyone can read
# rather than having been produced on someone's laptop.
#
# GopenPGP publishes no release assets of its own; Proton builds its Apple
# framework in-house. This workflow is that step, made public.
#
# **It runs upstream's own `build.sh`** rather than reimplementing the gomobile
# invocation. The first attempt here did reimplement it and got three things
# wrong that the build script encodes: gomobile has to be installed *into the
# gopenpgp module* (otherwise `x/mobile` is not in its dependency graph and the
# bind refuses), the framework binds six packages rather than just `crypto`,
# and it needs `-tags mobile,ios`. Calling their script means their packaging
# decisions cannot drift away from ours. The one patch applied to it, adding a
# linker flag, is in its own step below and fails loudly if it stops applying.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "gopenpgp tag to build (defaults to Dependencies/gopenpgp.env)"
        required: false
      replace:
        description: "Replace the release if one already exists for this version"
        type: boolean
        default: false
  push:
    # A change to the pinned version is the trigger. Nothing else rebuilds it:
    # a binary that silently changes is one nobody reviewed.
    paths:
      - Dependencies/gopenpgp.env
      - .github/workflows/gopenpgp-xcframework.yml

# Two runs raced on the first real build: a branch push and the merge of that
# same branch to main started nine seconds apart. One created the release and
# wrote its checksum into the notes, the other finished later and clobbered the
# asset — leaving a published checksum that did not describe the published
# binary. Serialised, and never cancelled: a half-finished release upload is
# worse than a slow queue.
concurrency:
  group: gopenpgp-xcframework
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # Pinned, not `macos-latest`: that label moves between images and this job
    # depends on the toolchain it finds.
    runs-on: macos-15
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          path: kypost

      - name: Resolve pinned version
        id: pin
        run: |
          set -euo pipefail
          source kypost/Dependencies/gopenpgp.env
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION:-$GOPENPGP_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ProtonMail/gopenpgp at $VERSION"

      - name: Is there anything to publish?
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: kypost
        # Asked before the build, not after. This job also triggers on changes
        # to its own workflow file, where the pinned version is usually
        # unchanged and its release already exists — so the previous shape
        # spent two minutes building and then failed on the last step because
        # there was nothing to do. A red run that means "nothing needed doing"
        # is worse than no run: it teaches people to ignore this check.
        run: |
          set -euo pipefail
          TAG="gopenpgp-${{ steps.pin.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "No release $TAG yet — building and publishing."
            exit 0
          fi
          if [ "${{ inputs.replace }}" = "true" ]; then
            echo "::warning::Replacing the existing release $TAG. Anything pinning the old checksum will stop resolving until Package.swift is updated."
            gh release delete "$TAG" --yes
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Release $TAG already exists and its binary is published, so there is nothing to build. To replace it deliberately, run this workflow manually with 'replace' checked. To publish a new build alongside it, bump GOPENPGP_VERSION."

      - name: Checkout gopenpgp
        if: steps.state.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          repository: ProtonMail/gopenpgp
          ref: ${{ steps.pin.outputs.version }}
          path: gopenpgp

      # Deliberately *not* pinning Xcode. Upstream's workflow pins 16.0.0,
      # which this job copied and which then failed outright — the runner image
      # it lands on need not carry that exact version, and pinning one that is
      # absent breaks on an image refresh rather than on a change to this code.
      # gomobile binds against whatever SDK the default toolchain provides, and
      # an older SDK with a newer deployment target is the ordinary direction.

      - uses: actions/setup-go@v7
        if: steps.state.outputs.publish == 'true'
        with:
          go-version: stable
          check-latest: true
          cache: false

      # The one change made to upstream's script: bake GODEBUG=asyncpreemptoff=1
      # into the embedded Go runtime. Without it the runtime's SIGURG
      # preemption signal lands on a thread whose sigaltstack non-Go code has
      # removed and the process dies ("signal 16 received on thread with no
      # signal stack / non-Go code disabled sigaltstack"). Setting the
      # environment variable from the app is too late: the c-archive runtime
      # initialises from an image constructor, before `main`. A `godebug`
      # directive is not an option either; cmd/go only accepts the keys in
      # internal/godebugs, and asyncpreemptoff is not one of them.
      #
      # `-X=runtime.godebugDefault=` is the string the runtime parses in
      # schedinit before any Go code runs. cmd/go adds its own `-X` for that
      # symbol only when the main module's go version needs compatibility
      # defaults; gomobile's generated module uses the toolchain's version, so
      # it adds none, and user ldflags come after it anyway (the last -X wins).
      # The verify step below fails the job if the value is not in a slice.
      - name: Bake asyncpreemptoff into the Go runtime
        if: steps.state.outputs.publish == 'true'
        working-directory: gopenpgp
        run: |
          set -euo pipefail
          FROM='-ldflags="-s -w "'
          TO='-ldflags="-s -w -X=runtime.godebugDefault=asyncpreemptoff=1"'
          # Exactly one match, or upstream changed the line and this patch
          # would silently not apply.
          [ "$(grep -cF -- "$FROM" build.sh)" = 1 ] || {
            echo "::error::build.sh no longer has exactly one $FROM; update this step."
            exit 1
          }
          sed -i '' "s|$FROM|$TO|" build.sh
          grep -nF -- "$TO" build.sh

      - name: Build with upstream's script
        if: steps.state.outputs.publish == 'true'
        working-directory: gopenpgp
        run: |
          set -euo pipefail
          chmod +x build.sh
          go version
          # `apple` builds ios,iossimulator,macos into dist/apple. This app is
          # macOS/iOS universal, and a framework missing a slice fails at link
          # time on whichever platform was omitted rather than here.
          ./build.sh apple
          find dist -maxdepth 3

      - name: Verify the runtime default is in every slice
        if: steps.state.outputs.publish == 'true'
        working-directory: gopenpgp/dist/apple
        run: |
          set -euo pipefail
          # The linker stores the -X value as its own string, once per arch.
          FOUND=0
          while IFS= read -r BIN; do
            ARCHS=$(lipo -archs "$BIN" | wc -w | tr -d ' ')
            HITS=$(strings -a "$BIN" | grep -c '^asyncpreemptoff=1$' || true)
            echo "$BIN: $ARCHS arch(s), $HITS baked default(s)"
            [ "$HITS" = "$ARCHS" ] || { echo "::error::$BIN is missing the baked GODEBUG default"; exit 1; }
            FOUND=$((FOUND + 1))
          done < <(find gopenpgp.xcframework -type f -name Gopenpgp)
          [ "$FOUND" = 3 ] || { echo "::error::expected 3 slices, found $FOUND"; exit 1; }

      - name: Package and checksum
        if: steps.state.outputs.publish == 'true'
        id: package
        run: |
          set -euo pipefail
          cd gopenpgp/dist/apple
          # Zipped from inside dist/apple so the archive root is the
          # .xcframework itself, which is what an SPM binaryTarget expects.
          zip -qry "$GITHUB_WORKSPACE/gopenpgp.xcframework.zip" gopenpgp.xcframework
          cd "$GITHUB_WORKSPACE"
          # An SPM binaryTarget checksum is a plain SHA-256 of the zip, so this
          # is verifiable without any Swift tooling.
          SHA=$(shasum -a 256 gopenpgp.xcframework.zip | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### GopenPGP ${{ steps.pin.outputs.version }}"
            echo
            echo "Pin these two in \`Package.swift\`:"
            echo '```'
            echo "url:      <the release asset URL below>"
            echo "checksum: $SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: steps.state.outputs.publish == 'true'
        working-directory: kypost
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG="gopenpgp-$VERSION"
          ASSET="$GITHUB_WORKSPACE/gopenpgp.xcframework.zip"
          # Quoted delimiter: the body is written verbatim, so backticks and
          # $ in it are not shell-interpreted. The values come in as env vars
          # rather than inline expressions for the same reason.
          cat > "$RUNNER_TEMP/notes.md" <<'NOTE'
          Built from ProtonMail/gopenpgp using that repository's own
          `build.sh apple`, with one change: its `-ldflags` also carry
          `-X=runtime.godebugDefault=asyncpreemptoff=1`, which turns off the
          Go runtime's signal-based preemption in every process that links
          this framework.

          SPM binaryTarget checksum (SHA-256 of the zip):
          NOTE
          {
            echo
            echo "    $SHA256"
            echo
            echo "Version: \`$VERSION\`  ·  Workflow run: $RUN_ID"
            echo
            echo "This does NOT rebuild bit-for-bit: the two builds made"
            echo "while this workflow was being debugged produced different"
            echo "hashes from the same pinned tag. gomobile embeds build IDs"
            echo "and paths, and this job does not pin the Xcode version, so"
            echo "the checksum identifies this specific build and is not a"
            echo "reproducibility claim. What it does give you is a binary"
            echo "whose build log is public and whose bytes cannot change"
            echo "under a pin without SPM refusing them."
          } >> "$RUNNER_TEMP/notes.md"

          # No --clobber. Replacing a published artifact in a crypto path is
          # an act someone performs on purpose, via the `replace` input, which
          # deletes the old release earlier in this job. By here the tag is
          # known not to exist.
          gh release create "$TAG" "$ASSET" \
            --title "GopenPGP $VERSION (XCFramework)" \
            --latest=false \
            --notes-file "$RUNNER_TEMP/notes.md"
