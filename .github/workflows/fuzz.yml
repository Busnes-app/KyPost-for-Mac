name: Fuzz

# libFuzzer over PgpMimeReader, the parser that reads decrypted PGP/MIME: a
# sender chooses every byte it sees. The harness is in `Fuzz/` and compiles
# the app's own source files (symlinked), not copies.
#
# Linux, not macOS: Xcode's toolchain ships no libFuzzer runtime for Swift,
# and the swift.org toolchain does. The image is pinned by digest. The parser
# is Foundation-only, so it builds against swift-corelibs-foundation. Where
# that and Apple's Foundation behave differently, this tests the Linux one.
#
# Bounded: 60 seconds from the seed corpus on every PR. A crash fails the job
# and the input that caused it is uploaded as the `fuzz-crash` artifact;
# keep it as a seed in `Fuzz/Corpus/PgpMimeReader` with the fix.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pgp-mime-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # swift:6.4.2-noble
      image: swift@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the fuzzer
        working-directory: Fuzz
        run: |
          set -euo pipefail
          swift --version
          swift build -c release --product FuzzPgpMimeReader \
            -Xswiftc -sanitize=fuzzer,address -Xswiftc -parse-as-library

      - name: Fuzz for 60 seconds
        working-directory: Fuzz
        run: |
          set -euo pipefail
          # New inputs go to a scratch directory; the committed seeds are
          # read only.
          mkdir -p "$RUNNER_TEMP/corpus" crashes
          .build/release/FuzzPgpMimeReader \
            -max_total_time=60 -max_len=16384 -timeout=10 -rss_limit_mb=2048 \
            -print_final_stats=1 -artifact_prefix=crashes/ \
            "$RUNNER_TEMP/corpus" Corpus/PgpMimeReader

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash
          path: Fuzz/crashes/
          if-no-files-found: ignore
