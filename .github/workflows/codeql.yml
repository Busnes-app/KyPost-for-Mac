name: CodeQL

# Replaces code scanning's default setup, which can only scan Actions here:
# Swift needs a build. Default setup must be off for these uploads to land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# Each non-PR run gets its own group: a ref-keyed group drops queued main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions

  swift:
    name: Analyze (swift)
    # About 42 macOS minutes, so not per pull request: main, weekly and by hand.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          queries: security-extended
          build-mode: manual
      # Both platforms: the app has iOS-only and macOS-only code. arm64 only and
      # unsigned: the source is arch-neutral and nothing here runs.
      - name: Build for the iOS Simulator
        run: >-
          .github/scripts/run-xcodebuild.sh build -scheme KyPost
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Build for macOS
        run: >-
          .github/scripts/run-xcodebuild.sh build -scheme KyPost
          -destination 'platform=macOS'
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift
